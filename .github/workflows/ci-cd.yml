name: Fraud Engine CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v4   # Updated from v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v5   # Updated from v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Train & Export XGBoost Model Artifact
      run: |
        python train_model.py

    - name: Run PyTest Unit & Integration Tests
      run: |
        python -m pytest -v

    - name: Verify Docker Build
      run: |
        docker build -t fraud-detection-engine:latest .
